name: 🚀 Deploy Laravel-Inertia to CPANEL

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, bcmath, intl, pdo_mysql, tokenizer, ctype, fileinfo
          coverage: none

      - name: 📦 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 📦 Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build frontend assets
        run: pnpm run build

      - name: 📝 Create production .env file
        run: |
          echo 'APP_NAME="AI Education Studio"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://aie-studio.jazbastudio.com' >> .env
          echo 'APP_LOCALE=en' >> .env
          echo 'APP_FALLBACK_LOCALE=en' >> .env
          echo '' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_STACK=single' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo '' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo '' >> .env
          echo 'SESSION_DRIVER=database' >> .env
          echo 'SESSION_LIFETIME=120' >> .env
          echo 'SESSION_ENCRYPT=false' >> .env
          echo '' >> .env
          echo 'CACHE_STORE=database' >> .env
          echo 'QUEUE_CONNECTION=database' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo '' >> .env
          echo 'STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}' >> .env
          echo 'STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}' >> .env
          echo '' >> .env
          echo 'VITE_APP_NAME="AI Education Studio"' >> .env

      - name: 🔧 Directory permissions
        run: |
          chmod -R 755 storage bootstrap/cache
          mkdir -p public/build
          touch storage/logs/laravel.log
          chmod -R 777 storage/logs

      - name: 🔗 Create storage link
        run: php artisan storage:link --force

      - name: ⚡ Cache Laravel config, routes & views
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            .
            !.git
            !.git*/**
            !node_modules/**
            !tests/**
            !.planning/**
            !.github/**
            !.windsurf/**
            !.cursor/**
            !.agent/**
            !storage/logs/**
            !storage/framework/cache/**
            !storage/framework/sessions/**
            !storage/framework/views/**
          retention-days: 1

  # ============================================================
  # DEPLOY: Single job with retry logic + persistent sync state
  # ============================================================
  # Strategy:
  #   1. Cache .ftp-deploy-sync-state.json across runs so resumed
  #      deployments skip already-uploaded files.
  #   2. Upload in 3 serial sub-tasks (core → public → vendor).
  #   3. Each sub-task wrapped in nick-fields/retry for auto-retry
  #      on ECONNRESET. Sync state persists between retries within
  #      the same job (same filesystem).
  # ============================================================
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 120
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build

      # Persist FTP sync state across workflow runs so failed deploys
      # can resume on next push instead of re-uploading everything.
      - name: � Restore FTP sync state cache
        uses: actions/cache@v4
        with:
          path: |
            .ftp-deploy-sync-state-core.json
            .ftp-deploy-sync-state-public.json
            .ftp-deploy-sync-state-vendor.json
          key: ftp-sync-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ftp-sync-state-${{ github.ref_name }}-
            ftp-sync-state-

      # ---------- Sub-task 1: Core application files ----------
      - name: 🔧 Deploy core files (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            npx --yes @samkirkland/ftp-deploy@1.2.5 \
              --server "jazbastudio.com" \
              --username "${{ secrets.FTP_USERNAME }}" \
              --password "${{ secrets.FTP_PASSWORD }}" \
              --port 990 \
              --protocol "ftps-legacy" \
              --security "loose" \
              --local-dir "./" \
              --server-dir "/public_html/" \
              --state-name ".ftp-deploy-sync-state-core.json" \
              --log-level "standard" \
              --exclude "**/.git*" \
              --exclude "**/.git*/**" \
              --exclude "**/node_modules/**" \
              --exclude "**/vendor/**" \
              --exclude "**/public/build/**" \
              --exclude "**/tests/**" \
              --exclude "**/.planning/**" \
              --exclude "**/.github/**" \
              --exclude "**/.windsurf/**" \
              --exclude "**/.cursor/**" \
              --exclude "**/.agent/**" \
              --exclude "**/storage/logs/**" \
              --exclude "**/storage/framework/cache/**" \
              --exclude "**/storage/framework/sessions/**" \
              --exclude "**/storage/framework/views/**" \
              --exclude "**/.ftp-deploy-sync-state-*.json"

      # ---------- Sub-task 2: Public build assets ----------
      - name: 🎨 Deploy public/build assets (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            npx --yes @samkirkland/ftp-deploy@1.2.5 \
              --server "jazbastudio.com" \
              --username "${{ secrets.FTP_USERNAME }}" \
              --password "${{ secrets.FTP_PASSWORD }}" \
              --port 990 \
              --protocol "ftps-legacy" \
              --security "loose" \
              --local-dir "./public/build/" \
              --server-dir "/public_html/public/build/" \
              --state-name "../../.ftp-deploy-sync-state-public.json" \
              --log-level "standard"

      # ---------- Sub-task 3: Vendor (largest, run last) ----------
      - name: 📦 Deploy vendor (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 8
          retry_wait_seconds: 60
          command: |
            npx --yes @samkirkland/ftp-deploy@1.2.5 \
              --server "jazbastudio.com" \
              --username "${{ secrets.FTP_USERNAME }}" \
              --password "${{ secrets.FTP_PASSWORD }}" \
              --port 990 \
              --protocol "ftps-legacy" \
              --security "loose" \
              --local-dir "./vendor/" \
              --server-dir "/public_html/vendor/" \
              --state-name "../.ftp-deploy-sync-state-vendor.json" \
              --log-level "standard"

      # Always save updated sync state so partial progress is preserved
      - name: 💾 Save FTP sync state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ftp-deploy-sync-state-core.json
            .ftp-deploy-sync-state-public.json
            .ftp-deploy-sync-state-vendor.json
          key: ftp-sync-state-${{ github.ref_name }}-${{ github.run_id }}
