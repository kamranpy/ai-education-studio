name: 🚀 Deploy Laravel-Inertia to CPANEL

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, bcmath, intl, pdo_mysql, tokenizer, ctype, fileinfo
          coverage: none

      - name: 📦 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 📦 Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build frontend assets
        run: pnpm run build

      - name: 📝 Create production .env file
        run: |
          echo 'APP_NAME="AI Education Studio"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://aie-studio.jazbastudio.com' >> .env
          echo 'APP_LOCALE=en' >> .env
          echo 'APP_FALLBACK_LOCALE=en' >> .env
          echo '' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_STACK=single' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo '' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo '' >> .env
          echo 'SESSION_DRIVER=database' >> .env
          echo 'SESSION_LIFETIME=120' >> .env
          echo 'SESSION_ENCRYPT=false' >> .env
          echo '' >> .env
          echo 'CACHE_STORE=database' >> .env
          echo 'QUEUE_CONNECTION=database' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo '' >> .env
          echo 'STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}' >> .env
          echo 'STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}' >> .env
          echo '' >> .env
          echo 'VITE_APP_NAME="AI Education Studio"' >> .env

      - name: 🔧 Directory permissions
        run: |
          chmod -R 755 storage bootstrap/cache
          mkdir -p public/build
          touch storage/logs/laravel.log
          chmod -R 777 storage/logs

      - name: 🔗 Create storage link
        run: php artisan storage:link --force

      - name: ⚡ Cache Laravel config, routes & views
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            .
            !.git
            !.git*/**
            !node_modules/**
            !tests/**
            !.planning/**
            !.github/**
            !.windsurf/**
            !.cursor/**
            !.agent/**
            !storage/logs/**
            !storage/framework/cache/**
            !storage/framework/sessions/**
            !storage/framework/views/**
          retention-days: 1

  # Deploy Phase 1: Core files (smaller, faster)
  deploy-core:
    name: � Deploy Core
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: 📂 Sync core files via FTP (lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" -p 21 jazbastudio.com <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:passive-mode yes
          set net:connection-limit 1
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set ftp:use-feat no
          set ftp:use-utf8 no
          lcd .
          cd /public_html/
          mirror -R -v --ignore-time -X .git* -X node_modules -X vendor -X public/build -X tests -X .planning -X .github -X .windsurf -X .cursor -X .agent -X AGENTS.md -X ARCHITECTURE.md -X CONVENTIONS.md -X ROADMAP.md -X PROJECT.md -X STACK.md -X "storage/logs/*" -X "storage/framework/cache/*" -X "storage/framework/sessions/*" -X "storage/framework/views/*" .
          bye
          EOF

  # Deploy Phase 2: Public Assets (built frontend)
  deploy-public:
    name: 🎨 Deploy Public Assets
    runs-on: ubuntu-latest
    needs: deploy-core
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: 📂 Sync public/build via FTP (lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" -p 21 jazbastudio.com <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:passive-mode yes
          set net:connection-limit 1
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set ftp:use-feat no
          set ftp:use-utf8 no
          lcd ./public/build/
          cd /public_html/public/build/
          mirror -R -v --ignore-time .
          bye
          EOF

  # Deploy Phase 3: Vendor (largest, most likely to fail - run last)
  deploy-vendor:
    name: 📦 Deploy Vendor
    runs-on: ubuntu-latest
    needs: deploy-public
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: 📂 Sync vendor via FTP (lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" -p 21 jazbastudio.com <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:passive-mode yes
          set net:connection-limit 1
          set net:max-retries 10
          set net:timeout 120
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set ftp:use-feat no
          set ftp:use-utf8 no
          lcd ./vendor/
          cd /public_html/vendor/
          mirror -R -v --ignore-time .
          bye
          EOF
